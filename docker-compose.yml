# Práctica de reverse proxy: nginx en el puerto 80/443 reparte las peticiones entre los servicios con HTTPS
#
#   docker compose up -d                    ← siempre desde esta carpeta
#     https://localhost/              → intranet
#     https://localhost/ecommundo/    → EcomMundo-Ordenagailu
#     https://localhost/mi-web/       → portal (web-publika/)
#
# HTTP se redirige automáticamente a HTTPS
# Solo el proxy publica puertos ("ports"). El resto de servicios no son accesibles desde fuera:
# se llega a ellos a través del proxy, que los encuentra por su nombre de servicio.

services:
  proxy:                        # reverse proxy HTTPS + portal
    image: nginx:alpine
    container_name: ecommundo-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ecommundo-network
      - nginx-reverse-proxy_default
    depends_on:
      - ecommundo
      - mi-web
      - intranet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ecommundo:                    # → /ecommundo/
    image: nginx:alpine
    container_name: ecommundo-app
    restart: unless-stopped
    volumes:
      - ./EcomMundo-Ordenagailu:/usr/share/nginx/html:ro
      - ./ecommundo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ecommundo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mi-web:                       # → /mi-web/
    image: nginx:alpine
    container_name: ecommundo-mi-web
    restart: unless-stopped
    volumes:
      - ./web-publika:/usr/share/nginx/html:ro
    networks:
      - ecommundo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  intranet:                     # → /
    image: nginx:alpine
    container_name: ecommundo-intranet
    restart: unless-stopped
    volumes:
      - ./intranet:/usr/share/nginx/html:ro
    networks:
      - ecommundo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ecommundo-network:
    driver: bridge
  nginx-reverse-proxy_default:
    external: true
