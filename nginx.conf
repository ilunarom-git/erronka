# Reverse proxy nginx: recibe todo el tráfico HTTP y HTTPS y lo reparte entre los servicios
# Con soporte completo para HTTPS, certificados SSL/TLS y redirección automática

# Resolver para DNS interno de Docker
resolver 127.0.0.11 valid=10s ipv6=off;

# Mapa para WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Configuración global de proxy
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 50m;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Redirigir HTTP a HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Permitir validación de certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS para intranet.codigoagil.localhost
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name intranet.codigoagil.localhost www.intranet.codigoagil.localhost;
    large_client_header_buffers 4 32k;

    # Certificados SSL/TLS
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    # Configuración SSL/TLS moderna y segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.google.com;" always;

    # Deshabilitar absolute redirects de los backends
    absolute_redirect off;

    # Proxy a Código Agil
    location /codigo-agil/ {
        proxy_pass http://codigo-agil:80/;
    }

    # Proxy a Mi-Web
    location /mi-web/ {
        proxy_pass http://mi-web:80/;
    }

    # Proxy a Code Server
    location /code/ {
        proxy_pass http://code-server:8080/;
        proxy_set_header Connection upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
    }

    # Proxy a Portainer
    location /portainer/ {
        proxy_pass http://portainer:9000/;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # Proxy a Adminer
    location /adminer/ {
        proxy_pass http://adminer:8080/;
    }

    # Proxy a Whoami
    location /whoami/ {
        proxy_pass http://whoami:80/;
    }

    # Proxy a Uptime Kuma
    location /kuma/ {
        proxy_pass http://kuma:3001/;
        proxy_set_header Connection upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    # Proxy a Intranet (root)
    location / {
        proxy_pass http://intranet:80;
    }
}

