# Configuración nginx para CodigoAgil
# Sirve archivos estáticos con caché y seguridad

server {
    listen 80 default_server;
    server_name codigoagil;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Caché de archivos estáticos (CSS, JS, imágenes)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML con caché corto
    location ~* \.html?$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Bloquear acceso a archivos ocultos y sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos de configuración
    location ~ \.(env|conf|yml|yaml|git|gitignore)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Ubicación raíz
    location / {
        try_files $uri $uri/ =404;
    }
}
